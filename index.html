<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f6b5c">
  <meta name="robots" content="noindex, nofollow">
  <title>Agenda</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icone.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Agenda">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>

  <!-- Carregando (enquanto o Firebase descobre se há alguém logado) -->
  <div id="carregando" class="tela-centro">
    <div class="spinner" aria-hidden="true"></div>
    <p>Carregando…</p>
  </div>

  <!-- Login -->
  <main id="tela-login" class="tela-centro" hidden>
    <form id="form-login" class="cartao-login" novalidate>
      <div class="marca">
        <span class="marca-icone" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h1V3a1 1 0 0 1 1-1Zm13 8H4v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-9ZM8 13h3v3H8v-3Z"/></svg>
        </span>
        <h1>Agenda</h1>
        <p class="sub">Entre com seu e-mail e senha</p>
      </div>

      <label for="login-email">E-mail</label>
      <input id="login-email" type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" required>

      <label for="login-senha">Senha</label>
      <div class="campo-senha">
        <input id="login-senha" type="password" autocomplete="current-password" required>
        <button type="button" id="btn-ver-senha" class="btn-ver-senha" aria-label="Mostrar senha">Mostrar</button>
      </div>

      <button type="submit" id="btn-entrar" class="btn btn-primario btn-largo">Entrar</button>
      <button type="button" id="btn-esqueci" class="btn-link">Esqueci minha senha</button>

      <p id="login-msg" class="mensagem" role="status" aria-live="polite"></p>
    </form>
  </main>

  <!-- Aplicativo (depois do login) -->
  <div id="tela-app" hidden>
    <header class="topo">
      <div class="topo-titulo">
        <strong id="topo-nome-clinica">Agenda</strong>
        <span id="selo-teste" class="selo-teste" hidden>MODO TESTE</span>
      </div>
      <div class="topo-usuario">
        <span id="topo-usuario-nome"></span>
        <button type="button" id="btn-sair" class="btn btn-fantasma">Sair</button>
      </div>
    </header>

    <div id="aviso-offline" class="aviso-offline" hidden>
      Sem conexão — você pode ver a agenda, mas não pode marcar nem alterar.
    </div>

    <div id="convite-instalar" class="convite-instalar" hidden>
      <p>Instale a agenda no celular para abrir com um toque.</p>
      <button type="button" id="btn-instalar" class="btn btn-primario">Instalar</button>
      <button type="button" id="btn-instalar-nao" class="btn-fechar" aria-label="Agora não">×</button>
    </div>

    <main id="conteudo" class="conteudo"></main>

    <nav class="menu" aria-label="Menu principal">
      <a href="#/dia" data-rota="dia">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h1V3a1 1 0 0 1 1-1Zm13 8H4v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-9Zm-9 2h6v2h-6v-2Zm0 4h6v2h-6v-2ZM6 12h2v2H6v-2Zm0 4h2v2H6v-2Z"/></svg>
        <span>Dia</span>
      </a>
      <a href="#/mes" data-rota="mes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h1V3a1 1 0 0 1 1-1Zm13 8H4v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-9ZM6 12h3v2H6v-2Zm5 0h2v2h-2v-2Zm4 0h3v2h-3v-2ZM6 16h3v2H6v-2Zm5 0h2v2h-2v-2Z"/></svg>
        <span>Mês</span>
      </a>
      <a href="#/busca" data-rota="busca">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10 3a7 7 0 0 1 5.6 11.2l4.6 4.6a1 1 0 0 1-1.4 1.4l-4.6-4.6A7 7 0 1 1 10 3Zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z"/></svg>
        <span>Buscar</span>
      </a>
      <a href="#/config" data-rota="config" id="menu-config" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8Zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm-1.2-8h2.4l.5 2.6c.6.2 1.2.5 1.7.9l2.5-.9 1.2 2.1-2 1.7c.1.6.1 1.2 0 1.8l2 1.7-1.2 2.1-2.5-.9c-.5.4-1.1.7-1.7.9l-.5 2.6h-2.4l-.5-2.6a6.6 6.6 0 0 1-1.7-.9l-2.5.9-1.2-2.1 2-1.7a5.6 5.6 0 0 1 0-1.8l-2-1.7 1.2-2.1 2.5.9c.5-.4 1.1-.7 1.7-.9L10.8 2Z" transform="translate(0 2)"/></svg>
        <span>Config.</span>
      </a>
    </nav>
  </div>

  <dialog id="modal" class="modal" aria-label="Janela"></dialog>
  <div id="impressao" class="impressao" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

</body>
</html>
